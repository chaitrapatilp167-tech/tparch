<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Tell Stackly about your architecture or interiors project and start a conversation with the studio."><title>Get started — Stackly</title><link rel="stylesheet" href="styles.css"></head><body>
<main class="auth-page"><section class="wrap auth-layout auth-start-layout">
<div class="auth-panel auth-form-panel"><button class="auth-back" type="button" data-go-back aria-label="Go back" title="Go back">←</button><a class="auth-brand" href="index.html"><img class="brand-logo" src="stackly_.webp" alt="Stackly"></a><div class="auth-panel-heading"><span class="auth-kicker">PROJECT INTRODUCTION</span><h2>Tell us what you have in mind.</h2><p>Share a little about your project. We’ll take it from there.</p></div><form id="start-form" novalidate><div class="form-row"><div class="field"><label for="start-name">Your name</label><input id="start-name" name="name" autocomplete="name" placeholder="Name" required></div><div class="field"><label for="start-email">Email address</label><input id="start-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required></div></div><div class="form-row"><div class="field"><label for="start-location">Project location</label><input id="start-location" name="location" placeholder="City or region" required></div><div class="field"><label for="start-type">Project type</label><select id="start-type" name="type" required><option value="" disabled selected>Select one</option><option>New home</option><option>Renovation</option><option>Interior design</option><option>Workplace or hospitality</option><option>Early project advice</option><option>Other</option></select></div></div><div class="field"><label for="start-stage">Where are you in the process?</label><select id="start-stage" name="stage" required><option value="" disabled selected>Select your stage</option><option>Just exploring ideas</option><option>Looking at a property or site</option><option>I own the property</option><option>Ready to begin design</option></select></div><div class="field"><label for="start-message">A little about your project</label><textarea id="start-message" name="message" placeholder="Your goals, timing, or questions…" required></textarea></div><button class="submit auth-submit" type="submit">Send project in </section></main><script src="script.js"></script></body></html>
